services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sos-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    container_name: sos-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
