server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hỗ trợ client-side routing (React SPA)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache tĩnh cho assets đã hash của Vite
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
